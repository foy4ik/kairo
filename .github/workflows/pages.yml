name: Web demo

# Publishes the same UI, running on the in-browser backend, to GitHub Pages: https://foy4ik.github.io/kairo/
# Visitors' data stays in their own browser (localStorage); nothing is sent to any server.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { VITE_WEB_DEMO: '1' }
      - name: Demo media for the phone screen (screenshots and video)
        run: |
          mkdir -p dist/demo
          cp -r docs/screenshots dist/demo/screenshots
          cp docs/demo/kairo-demo.mp4 dist/demo/kairo-demo.mp4
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
