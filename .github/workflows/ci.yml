name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: { PW_CHANNEL: chromium }

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: '--bundles nsis' }
          - { os: macos-latest, args: '--bundles dmg' }
          - { os: ubuntu-22.04, args: '--bundles deb,appimage' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run tauri -- build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: kairo-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
